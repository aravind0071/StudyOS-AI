version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyos_user
      POSTGRES_PASSWORD: studyos_password
      POSTGRES_DB: studyos_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyos_user -d studyos_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://studyos_user:studyos_password@postgres:5432/studyos_ai
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEMO_MODE: ${DEMO_MODE:-true}
      FRONTEND_URL: http://localhost:3000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
